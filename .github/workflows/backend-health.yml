# Checks the production backend the mobile app talks to.
#
# The URL is read from mobile/config.py (PRODUCTION_API_BASE), so this always
# probes exactly what the APK/IPA calls. Fails when /health answers but the
# feature routes are not mounted — the state a Railway service with
# Root Directory = mobile ends up in, where every screen 404s.
# Missing optional server configuration (Solarman credentials, WeatherAPI key)
# is reported as a warning, not a failure. The labs API and the 3D lab page
# must answer: the app's Labs screen is built on them.

name: Backend health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "mobile/config.py"
      - "api/labs.py"
      - ".github/workflows/backend-health.yml"

permissions:
  contents: read

jobs:
  health:
    name: Production API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe production backend
        run: |
          python3 - <<'EOF'
          import json, re, time, urllib.error, urllib.request

          src = open("mobile/config.py", encoding="utf-8").read()
          base = re.search(r'PRODUCTION_API_BASE\s*=\s*"([^"]+)"', src).group(1).rstrip("/")
          print(f"Backend: {base}")

          def get(path, timeout=60):
              t0 = time.time()
              try:
                  with urllib.request.urlopen(base + path, timeout=timeout) as r:
                      body = r.read().decode("utf-8", "replace")
                      code = r.status
              except urllib.error.HTTPError as e:
                  body, code = e.read().decode("utf-8", "replace"), e.code
              except Exception as e:
                  body, code = f"{type(e).__name__}: {e}", 0
              print(f"GET {path} -> {code} in {time.time() - t0:.1f}s")
              try:
                  return code, json.loads(body)
              except ValueError:
                  return code, body[:300]

          code, health = get("/health")
          print(json.dumps(health, indent=2, ensure_ascii=False) if isinstance(health, dict) else health)
          if code != 200 or not isinstance(health, dict):
              raise SystemExit("::error::/health did not return JSON 200")
          if not (health.get("api") == "full" or "forecast_backend" in health):
              raise SystemExit(
                  "::error::Feature routes are NOT mounted (api="
                  f"{health.get('api')!r}, error={health.get('api_router_error')!r}). "
                  "Railway service must deploy from the repository root with "
                  "`uvicorn main:app --host 0.0.0.0 --port $PORT`."
              )
          models = health.get("models_loaded") or {}
          if not (models.get("solar") and models.get("wind")):
              raise SystemExit(f"::error::Models not loaded: {models}")
          print("OK: feature routes mounted, solar and wind models loaded")

          code, live = get("/solarman/live?demo=false")
          if code == 200 and isinstance(live, dict):
              print(f"OK: Solarman live source={live.get('source')}")
          else:
              print(f"::warning::/solarman/live without demo -> {code}: {str(live)[:200]} "
                    "(Solarman credentials missing on the server? The app then shows demo data.)")

          code, fc = get("/solarman/forecast?dc_capacity_kwp=25")
          if code == 200 and isinstance(fc, dict) and fc.get("forecasts"):
              print(f"OK: 24h forecast returned {len(fc['forecasts'])} hours")
          else:
              print(f"::warning::/solarman/forecast -> {code}: {str(fc)[:200]} "
                    "(WEATHERAPI_KEY missing on the server? The 24h screen stays empty.)")

          # Routes behind the Training, Sustainability and Labs screens. A 404
          # means the deployed server predates them (Railway deploys main).
          def post(path, payload, timeout=60):
              req = urllib.request.Request(
                  base + path,
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception:
                  return 0

          screens = {
              "/metrics (Training)": get("/metrics")[0],
              "/sustainability/impact (Sustainability)": post(
                  "/sustainability/impact", {"renewable_kwh": 1000}),
              "/labs/microgrid-day (Labs)": post(
                  "/labs/microgrid-day", {"weather": "synthetic"}),
          }
          for name, status in screens.items():
              if status == 200:
                  print(f"OK: {name}")
              else:
                  print(f"::warning::{name} -> {status} (server not redeployed from main yet?)")

          # The 12 labs in the app (api/labs.py) and the 3D lab page it opens.
          # These are on main, so a failure here is a broken deploy, not a lag.
          problems = []
          code, labs = get("/labs")
          labs = labs.get("labs") if isinstance(labs, dict) else None
          if code != 200 or not labs or len(labs) != 12:
              problems.append(f"/labs -> {code}, {len(labs or [])} labs")
          else:
              print("OK: /labs lists the 12 labs")
              if "task_count" not in labs[0]:
                  print("::warning::/labs has no task_count (server not redeployed from main yet?)")
          code, lab = get("/labs/lab_pv_physics")
          if code != 200 or not isinstance(lab, dict) or not lab.get("params") or not lab.get("tasks"):
              problems.append(f"/labs/lab_pv_physics -> {code}")
          else:
              print(f"OK: lab 1 has {len(lab['params'])} parameters and {len(lab['tasks'])} tasks")
          req = urllib.request.Request(
              base + "/labs/lab_pv_physics/run", data=b'{"params": {}}',
              headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  run = json.loads(r.read())
              print(f"OK: lab 1 ran, {len(run.get('metrics') or [])} metrics")
          except Exception as e:
              problems.append(f"POST /labs/lab_pv_physics/run -> {e}")
          code, test = get("/labs/lab_pv_physics/test?lang=kk")
          if code != 200 or not isinstance(test, dict) or not test.get("questions"):
              problems.append(f"/labs/lab_pv_physics/test -> {code}")
          else:
              print(f"OK: lab 1 test has {len(test['questions'])} questions")
          for path in ("/static/lab3d/index.html", "/static/lab3d/lab3d.js", "/static/lab3d/assembly.json"):
              code, _ = get(path)
              if code != 200:
                  problems.append(f"{path} -> {code}")
          if not problems:
              print("OK: the 3D lab page and its files are served")
          if problems:
              raise SystemExit("::error::Labs API broken: " + "; ".join(problems))
          EOF
