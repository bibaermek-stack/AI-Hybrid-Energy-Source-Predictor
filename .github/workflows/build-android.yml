# Android build for the Flet mobile app (mobile/).
#
# Every push that touches mobile/ builds a debug-signed APK you can sideload.
# A v* tag additionally builds a release-signed AAB for Google Play, once the
# upload keystore secrets below exist (Settings -> Secrets -> Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_PASSWORD       key password
#   ANDROID_KEY_ALIAS          key alias
#
# flet build installs the Flutter SDK version it requires (--yes); do not add a
# separate Flutter setup step — a mismatched Flutter makes the build fail.
#
# The emulator-test job then installs that APK on an Android 14 emulator and
# drives it with adb (scripts/android_emulator_smoke.sh): launch, Back from a
# tab and from a More screen, Back on Home, camera. Screenshots are uploaded.

name: Build Android (Flet)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"
      - "scripts/android_*"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLET_CLI_NO_RICH_OUTPUT: "1"
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Flutter SDK installed by flet
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flet-flutter-${{ runner.os }}-${{ hashFiles('mobile/pyproject.toml') }}

      # Only the CLI: the app's own dependencies come from mobile/pyproject.toml
      # and are resolved for Android by flet build, not installed here.
      - name: Install Flet CLI
        run: pip install "flet[cli]==1.0.1"

      - name: Build APK
        run: flet build apk mobile --yes --build-number ${{ github.run_number }}

      - name: Build signed AAB (Google Play)
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          FLET_ANDROID_SIGNING_KEY_STORE="$RUNNER_TEMP/upload.jks" \
            flet build aab mobile --yes --build-number ${{ github.run_number }}
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EcoPredict-AI-Android-APK
          path: mobile/build/apk/
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: EcoPredict-AI-Android-AAB
          path: mobile/build/aab/
          if-no-files-found: error
          retention-days: 14

  emulator-test:
    name: Emulator smoke test (launch, Back, camera)
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: EcoPredict-AI-Android-APK
          path: mobile/build/apk/

      # Hardware acceleration for the x86_64 emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: emulator-artifacts
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          # The action runs `script` line by line, so keep it to one command.
          script: bash scripts/android_emulator_smoke.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EcoPredict-AI-Android-emulator
          path: emulator-artifacts/
          if-no-files-found: warn
          retention-days: 14
